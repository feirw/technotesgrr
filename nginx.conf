worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        text/xml
        image/svg+xml
        font/woff2
        application/vnd.ms-fontobject;

    server {
        listen 80;
        listen [::]:80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Vite hashed bundles — long cache, immutable (LCP/TTFB on repeat visits)
        location ^~ /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Εικονίδια / manifest — αλλάζουν συχνά· όχι long immutable cache
        location = /favicon.ico {
            add_header Cache-Control "public, max-age=0, must-revalidate";
        }
        location = /favicon.png {
            add_header Cache-Control "public, max-age=0, must-revalidate";
        }
        location = /apple-touch-icon.png {
            add_header Cache-Control "public, max-age=0, must-revalidate";
        }
        location = /site.webmanifest {
            add_header Cache-Control "public, max-age=0, must-revalidate";
        }

        # FastAPI (Uvicorn) — same host, browser calls /api/...
        location /api/ {
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            # SSE (/api/chat/stream): μην buffer-άρεις αλλιώς καθυστερεί το stream
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }

        # Παλιά θέματα: inline PDF + σωστό root (αλλιώς μόνο add_header → 404)
        location ~* ^/pdfs/.+\.pdf$ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            add_header Content-Disposition "inline" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
