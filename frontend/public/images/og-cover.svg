    </text>
    <text x="100" y="420" font-family="Manrope, Poppins, Inter, system-ui, -apple-system, Segoe UI, Roboto" font-weight="600" font-size="32" fill="#374151">
      Quiz • Flashcards • Community • Progress • Study Timer • Chatbot
