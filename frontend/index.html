<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Πληροφορική Πανελλήνιες | Technotes</title>

    <link rel="icon" href="/favicon.ico?v=5" type="image/x-icon" sizes="any" />
    <link rel="icon" href="/favicon.png?v=5" type="image/png" sizes="32x32" />
    <link rel="shortcut icon" href="/favicon.ico?v=5" type="image/x-icon" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5" />
    <!-- manifest link is injected automatically by vite-plugin-pwa -->
    <meta name="theme-color" content="#ff97b2" />

    <!-- PWA / installed-app behavior (iOS Safari doesn't read the manifest for these) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TechNotesGR" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Fallback SEO (ενημερώνεται δυναμικά από SeoHead) -->
    <meta
      name="description"
      content="Δωρεάν προετοιμασία Πληροφορικής Πανελληνίων: quiz, flashcards, ΑΕΠΠ, δομημένος προγραμματισμός και ασκήσεις για Γ' Λυκείου."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://technotesgr.com/" />

    <!-- LCP: preload mobile hero before JS boots (light theme = PageSpeed default) -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/home%20page/bc11-800.webp"
      imagesrcset="/images/home%20page/bc11-800.webp 800w, /images/home%20page/bc11-1280.webp 1280w"
      imagesizes="100vw"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script src="/env.js"></script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
